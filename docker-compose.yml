# ANILLIEA — local development database.
#
# Starts PostgreSQL 16 for local development. The Next.js app itself is NOT
# containerised — run it on the host with `npm run dev`.
#
#   docker compose up -d        # start postgres
#   docker compose down         # stop (data persists in the pgdata volume)
#   docker compose down -v      # stop AND delete all data

services:
  postgres:
    image: postgres:16-alpine
    container_name: anilliea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anilliea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anilliea}
      POSTGRES_DB: ${POSTGRES_DB:-anilliea}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-anilliea} -d $${POSTGRES_DB:-anilliea}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
